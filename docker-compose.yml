services:
  traefik:
    image: traefik:v3.6
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --api.insecure=true
    ports:
      - "80:80"
      - "8081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: jobhunter
      POSTGRES_PASSWORD: jobhunter
      POSTGRES_DB: jobs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka

  job-service:
    build: ./services/job-service
    depends_on:
      - postgres
      - kafka
    labels:
      - traefik.enable=true
      - traefik.http.services.job.loadbalancer.server.port=8000
      - traefik.http.routers.jobs.rule=PathPrefix(`/jobs`)
      - traefik.http.routers.jobs.middlewares=jwt-auth
      - traefik.http.routers.jobs-docs.rule=PathPrefix(`/docs/jobs`)

  crawler:
    build: ./services/crawler
    depends_on:
      - kafka

  user-service:
    build: ./services/user-service
    environment:
      DATABASE_URL: postgresql+asyncpg://jobhunter:jobhunter@postgres:5432/users
      JWT_SECRET: change-me-in-real-deployments
    depends_on:
      - postgres
      - kafka
    labels:
      - traefik.enable=true
      - traefik.http.services.user.loadbalancer.server.port=8000
      # /auth/verify is intentionally NOT routed: it is only called by Traefik, internally
      - traefik.http.routers.auth.rule=Path(`/auth/register`) || Path(`/auth/login`)
      - traefik.http.routers.subs.rule=PathPrefix(`/subscriptions`)
      - traefik.http.routers.subs.middlewares=jwt-auth
      - traefik.http.routers.users-docs.rule=PathPrefix(`/docs/users`)
      - traefik.http.middlewares.jwt-auth.forwardauth.address=http://user-service:8000/auth/verify
      - traefik.http.middlewares.jwt-auth.forwardauth.authResponseHeaders=X-User-Id

  matching-service:
    build: ./services/matching-service
    environment:
      DATABASE_URL: postgresql+asyncpg://jobhunter:jobhunter@postgres:5432/matching
    depends_on:
      - postgres
      - kafka

  notification-service:
    build: ./services/notification-service
    environment:
      DATABASE_URL: postgresql+asyncpg://jobhunter:jobhunter@postgres:5432/notifications
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    depends_on:
      - postgres
      - kafka

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - job-service

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  pgdata:
  grafanadata:
